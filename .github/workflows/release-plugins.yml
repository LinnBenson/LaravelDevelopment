name: Release plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/Plugins/ToView/**'
      - 'app/Plugins/LaravelTool/**'
      - '.github/workflows/release-plugins.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: plugins-latest

    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 打包插件
        shell: bash
        run: |
          set -euo pipefail

          release_dir="${RUNNER_TEMP}/plugin-release"
          mkdir -p "${release_dir}" "${GITHUB_WORKSPACE}/dist"

          for plugin in ToView LaravelTool; do
            test -f "app/Plugins/${plugin}/index.php"

            mkdir -p "${release_dir}/${plugin}"
            cp -a "app/Plugins/${plugin}/." "${release_dir}/${plugin}/"

            (
              cd "${release_dir}"
              zip -qr "${GITHUB_WORKSPACE}/dist/${plugin}.zip" "${plugin}"
            )
          done

      - name: 检查压缩包
        shell: bash
        run: |
          set -euo pipefail

          unzip -t dist/ToView.zip
          unzip -t dist/LaravelTool.zip

      - name: 创建或更新 Release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/ToView.zip \
              dist/LaravelTool.zip \
              --clobber

            gh release edit "${RELEASE_TAG}" \
              --title "Plugins Latest" \
              --notes "这里是系统默认的插件更新安装包。" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              dist/ToView.zip \
              dist/LaravelTool.zip \
              --target "${GITHUB_SHA}" \
              --title "Plugins Latest" \
              --notes "这里是系统默认的插件更新安装包。" \
              --latest
          fi
